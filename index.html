<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For you</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0a1a;
      min-height: 100vh;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    #message h1 {
      color: #e8c99a;
      font-size: 2rem;
      font-weight: normal;
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    #message p {
      color: #c8a87a;
      font-size: 1rem;
      line-height: 1.9;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="message">
    <h1>Your title here</h1>
    <p>Your message here</p>
  </div>

  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      drawCover();
    }

   function drawCover() {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.8);
  grad.addColorStop(0, '#1a0f2e');
  grad.addColorStop(0.5, '#0d0818');
  grad.addColorStop(1, '#050310');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 180; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = Math.random() * 1.2 + 0.3;
    const alpha = Math.random() * 0.6 + 0.2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,240,200,${alpha})`;
    ctx.fill();
  }
}
    }

    window.addEventListener('resize', resize);
    resize();
  </script>

</body>
</html>
