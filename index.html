<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>hi sillyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: none;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Caveat', cursive;
      overflow: hidden;
      user-select: none;
    }

    #content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px;
    }

    #sticky {
      max-width: 300px;
      flex-shrink: 0;
      background: #ffb3c6;
      border-radius: 4px;
      padding: 28px 30px 36px;
      box-shadow:
        3px 3px 8px rgba(0,0,0,0.15),
        0 1px 2px rgba(0,0,0,0.1);
      transform: rotate(-1.5deg);
      position: relative;
    }

    #sticky::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 20px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 2px;
    }

    #sticky h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #7a1a2e;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    #sticky p {
      font-size: 1.25rem;
      line-height: 1.75;
      color: #5a1020;
    }

    #kitty {
      width: min(600px, 80vw);
      height: auto;
      flex-shrink: 0;
      display: block;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    #hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: rgba(80, 40, 0, 0.45);
      letter-spacing: 0.06em;
      pointer-events: none;
      transition: opacity 0.4s;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      #content {
        flex-direction: column-reverse;
        gap: 32px;
        justify-content: center;
      }
      #kitty { width: min(220px, 60vw); }
      #sticky { max-width: 280px; transform: rotate(-1deg); }
    }
  </style>
</head>
<body>

  <div id="content">
    <div id="sticky">
      <h1>Hi sillyyyy</h1>
      <p>
        Kitty saw you working hard!!!<br/><br/>
        so kitty gave you a flower<br/>
        but its his flower so he's a lil grumpy giving it away<br/><br/>
        love you soooo muchhh!! drink sum water n rest well!
      </p>
    </div>
    <img id="kitty" src="kitty.png" alt="kittyyyyyy"/>
  </div>

  <canvas id="c"></canvas>
  <div id="hint">scratch to reveal! 🐾</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const kittyImg = document.getElementById('kitty');
    let W, H, painting = false;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      drawCover();
    }

    function drawCover() {
      // Sample exact bg color from kitty image
      const offscreen = document.createElement('canvas');
      offscreen.width = kittyImg.naturalWidth || 10;
      offscreen.height = kittyImg.naturalHeight || 10;
      const offCtx = offscreen.getContext('2d');
      offCtx.drawImage(kittyImg, 0, 0);
      const pixel = offCtx.getImageData(5, 5, 1, 1).data;
      const bgColor = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
      document.body.style.background = bgColor;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);

      const colors = [
        'rgba(255, 255, 255, 0.75)',
        'rgba(255, 255, 255, 0.45)',
        'rgba(255, 250, 230, 0.8)',
        'rgba(255, 252, 240, 0.55)',
      ];

      const spacing = 44;
      const cols = Math.ceil(W / spacing) + 1;
      const rows = Math.ceil(H / spacing) + 1;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacing + (row % 2 === 0 ? 0 : spacing / 2);
          const y = row * spacing;
          const r = 9 + Math.sin(col * 2.3 + row * 1.7) * 3;
          const color = colors[(col + row * 2) % colors.length];
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
      }
    }

    function scratch(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    canvas.addEventListener('mousedown', e => { painting = true; hint.style.opacity = '0'; scratch(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', e => { if (painting) scratch(e.clientX, e.clientY); });
    canvas.addEventListener('mouseup', () => painting = false);

    canvas.addEventListener('touchstart', e => {
      e.preventDefault(); painting = true; hint.style.opacity = '0';
      const t = e.touches[0]; scratch(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0]; scratch(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchend', () => painting = false);

    window.addEventListener('load', resize);
    window.addEventListener('resize', resize);
  </script>

</body>
</html>
